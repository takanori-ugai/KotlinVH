# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Java CI

on: [push]

permissions:
  contents: read
  checks: write

jobs:
  build:
    strategy:
        matrix:
          java_version: [17, 21, 25]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5.0.0
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v5.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.3
      - name: Build with Gradle (Java 25)
        if: matrix.java_version == 25
        run: ./gradlew build -x detekt
      - name: Build with Gradle
        if: matrix.java_version != 25
        run: ./gradlew build
      - name: Upload coverage reports to Codecov
        if: matrix.java_version == '17'
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          slug: takanori-ugai/Kotlin
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5.6.2
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          include_passed: true
